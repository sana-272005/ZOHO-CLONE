<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoho - Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./signup.css">
</head>
<body>

<div class="header">
    <div class="zoho_logo">
        <div class="chain">
            <div class="box red"></div>
            <div class="box green"></div>
            <div class="box blue"></div>
            <div class="box yellow"></div>
        </div>
        <div class="zoho-text">ZOHO</div>
    </div>
    <div class="header-right">Have a Zoho Account? <a href="#">SIGN IN</a></div>
</div>

<div class="main">
    <div class="form-box">
        <h2>Start with your free account today.</h2>

        <div class="input-group">
    <input type="text" placeholder="Email *">
</div>

<div class="input-group">
    <input type="password" placeholder="Password *">
    <i class="fa-regular fa-eye-slash"></i>
</div>

<div class="input-group">
    <input type="text" placeholder="Phone Number *">
</div>
        <div class="check">
            <input type="checkbox">
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
        </div>

        <button class="signup-btn">SIGN UP FOR FREE</button>

        <div class="social">
            <span>or sign in using</span>
            <div class="icon g"><i class="fa-brands fa-google"></i></div>
            <div class="icon in"><i class="fa-brands fa-linkedin-in"></i></div>
            <div class="icon ms">
                <span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span>
            </div>
        </div>
    </div>
</div>

<footer>© 2026, Zoho Corporation Pvt. Ltd. All Rights Reserved.</footer>

</body>
</html>
